services:
  api:
    build: .
    image: rice-leaf-disease-api
    ports:
      - "8000:8000"
    volumes:
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s